<div id="sortviz">
  <style>
    #sortviz { font-family: inherit; }
    #sortviz .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
    #sortviz h3 { margin: 0; font-size: 1.05em; }
    #sortviz .ctrl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; margin-bottom: 14px; }
    #sortviz .ctl { display: flex; flex-direction: column; gap: 4px; }
    #sortviz .ctl .form-label { margin: 0; }
    #sortviz .ctl-row { display: grid; grid-template-columns: 1fr 64px; align-items: center; gap: 8px; }
    #sortviz .ctl-row output { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
    #sortviz .actions { display: flex; gap: 8px; margin-bottom: 14px; }
    #sortviz .stats { display: flex; flex-wrap: wrap; gap: 8px 44px; margin-bottom: 12px; }
    #sortviz .stats .viz-stat-value { font-size: 1.35em; }
    #sortviz .plot { position: relative; height: 240px; }
    #sortviz .bar { position: absolute; bottom: 0; border-radius: 2px 2px 0 0; transition: left 140ms ease-out, background-color 140ms ease-out, height 140ms ease-out; }
    @keyframes sortviz-fade { from { opacity: 0; } }
    #sortviz .plot { animation: sortviz-fade 300ms ease-out; }
    @media (prefers-reduced-motion: reduce) {
      #sortviz .bar { transition: none; }
      #sortviz .plot { animation: none; }
    }
  </style>

  <div class="head">
    <h3>排序算法可视化</h3>
    <span class="text-small" id="sortviz-status">就绪</span>
  </div>

  <div class="ctrl-grid">
    <div class="ctl">
      <label class="form-label" for="sortviz-algo">算法</label>
      <select id="sortviz-algo" class="form-select">
        <option value="bubble">冒泡排序</option>
        <option value="selection">选择排序</option>
        <option value="insertion">插入排序</option>
        <option value="quick">快速排序</option>
      </select>
    </div>
    <div class="ctl">
      <label class="form-label" for="sortviz-mode">数据形态</label>
      <select id="sortviz-mode" class="form-select">
        <option value="random">随机</option>
        <option value="nearly">接近有序</option>
        <option value="reversed">逆序</option>
      </select>
    </div>
    <div class="ctl">
      <label class="form-label" for="sortviz-n">元素数量</label>
      <div class="ctl-row">
        <input id="sortviz-n" type="range" min="8" max="60" step="1" value="24">
        <output id="sortviz-n-out">24</output>
      </div>
    </div>
    <div class="ctl">
      <label class="form-label" for="sortviz-speed">播放速度</label>
      <div class="ctl-row">
        <input id="sortviz-speed" type="range" min="5" max="200" step="5" value="40">
        <output id="sortviz-speed-out">40 ms</output>
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="sortviz-toggle" class="btn btn-primary">开始</button>
    <button id="sortviz-regenerate" class="btn btn-ghost">重新生成</button>
  </div>

  <div class="stats">
    <div>
      <div class="text-small">比较次数</div>
      <div class="viz-stat-value" id="sortviz-compares">0</div>
    </div>
    <div>
      <div class="text-small">交换 / 写入次数</div>
      <div class="viz-stat-value" id="sortviz-writes">0</div>
    </div>
    <div>
      <div class="text-small">当前步骤</div>
      <div class="viz-stat-value" id="sortviz-step">0 / 0</div>
    </div>
  </div>

  <div class="plot" id="sortviz-plot"></div>
</div>
<script>
(function () {
  var root = document.getElementById('sortviz');
  var plot = document.getElementById('sortviz-plot');
  var algoEl = document.getElementById('sortviz-algo');
  var modeEl = document.getElementById('sortviz-mode');
  var nEl = document.getElementById('sortviz-n');
  var speedEl = document.getElementById('sortviz-speed');
  var toggleEl = document.getElementById('sortviz-toggle');
  var regenEl = document.getElementById('sortviz-regenerate');
  var statusEl = document.getElementById('sortviz-status');
  var cmpEl = document.getElementById('sortviz-compares');
  var wrEl = document.getElementById('sortviz-writes');
  var stepEl = document.getElementById('sortviz-step');

  var n = 24, arr = [], bars = [];
  var steps = [], stepIdx = 0, compares = 0, writes = 0;
  var playing = false, finished = false;

  function values() {
    return {
      algo: algoEl.value, mode: modeEl.value,
      n: Number(nEl.value), delay: Number(speedEl.value),
    };
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function generateData(mode, len) {
    var a = [];
    for (var i = 1; i <= len; i++) a.push(i);
    if (mode === 'random') return shuffle(a);
    if (mode === 'reversed') return a.reverse();
    // nearly sorted: sorted, then ~len/8 random swaps
    for (var k = 0; k < Math.max(1, Math.floor(len / 8)); k++) {
      var i = Math.floor(Math.random() * len);
      var j = Math.floor(Math.random() * len);
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildSteps(algo, base) {
    var a = base.slice(), out = [];
    function record(compI, compJ, swI, swJ) {
      out.push({ c: [compI, compJ], s: swI !== undefined ? [swI, swJ] : null });
    }
    if (algo === 'bubble') {
      for (var i = 0; i < a.length - 1; i++) {
        for (var j = 0; j < a.length - 1 - i; j++) {
          if (a[j] > a[j + 1]) {
            record(j, j + 1, j, j + 1);
            var t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;
          } else record(j, j + 1);
        }
      }
    } else if (algo === 'selection') {
      for (var i = 0; i < a.length - 1; i++) {
        var min = i;
        for (var j = i + 1; j < a.length; j++) {
          record(min, j);
          if (a[j] < a[min]) min = j;
        }
        if (min !== i) {
          record(i, min, i, min);
          var t = a[i]; a[i] = a[min]; a[min] = t;
        }
      }
    } else if (algo === 'insertion') {
      for (var i = 1; i < a.length; i++) {
        var key = a[i], j = i - 1;
        while (j >= 0) {
          if (a[j] > key) {
            record(j, j + 1, j, j + 1);
            a[j + 1] = a[j];
            j--;
          } else {
            record(j, j + 1);
            break;
          }
        }
        if (j + 1 !== i) { a[j + 1] = key; }
      }
    } else { // quick
      (function qs(lo, hi) {
        if (lo >= hi) return;
        var pivot = a[hi], i = lo;
        for (var j = lo; j < hi; j++) {
          record(j, hi);
          if (a[j] < pivot) {
            if (i !== j) {
              record(i, j, i, j);
              var t = a[i]; a[i] = a[j]; a[j] = t;
            }
            i++;
          }
        }
        if (i !== hi) {
          record(i, hi, i, hi);
          var t = a[i]; a[i] = a[hi]; a[hi] = t;
        }
        qs(lo, i - 1);
        qs(i + 1, hi);
      })(0, a.length - 1);
    }
    return out;
  }

  function renderBars() {
    plot.innerHTML = '';
    bars = [];
    var max = n;
    for (var i = 0; i < n; i++) {
      var b = document.createElement('div');
      b.className = 'bar';
      var h = (arr[i] / max) * 100;
      b.style.height = h + '%';
      b.style.left = (i / n * 100) + '%';
      b.style.width = 'calc(' + (100 / n) + '% - ' + (n > 40 ? 0.5 : 1.5) + 'px)';
      b.dataset.idx = i;
      plot.appendChild(b);
      bars.push(b);
    }
  }

  function rebuild() {
    var v = values();
    n = v.n;
    arr = generateData(v.mode, n);
    steps = buildSteps(v.algo, arr);
    stepIdx = 0; compares = 0; writes = 0;
    finished = false; playing = false;
    toggleEl.textContent = '开始';
    toggleEl.disabled = false;
    statusEl.textContent = '就绪';
    renderBars();
    updateStats();
  }

  function setBars(si, sj) {
    bars[si].style.left = (si / n * 100) + '%';
    bars[sj].style.left = (sj / n * 100) + '%';
  }

  function updateStats() {
    cmpEl.textContent = compares.toLocaleString();
    wrEl.textContent = writes.toLocaleString();
    stepEl.textContent = stepIdx + ' / ' + steps.length;
  }

  function clearHighlight() {
    for (var i = 0; i < bars.length; i++) bars[i].classList.remove('active');
  }

  function applyStep(step) {
    clearHighlight();
    bars[step.c[0]].classList.add('active');
    bars[step.c[1]].classList.add('active');
    compares++;
    if (step.s) {
      writes++;
      var i = step.s[0], j = step.s[1];
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      var tmp = bars[i]; bars[i] = bars[j]; bars[j] = tmp;
      setBars(i, j);
    }
  }

  var timer = null, cancelled = false;

  function tick() {
    if (cancelled || stepIdx >= steps.length) {
      if (stepIdx >= steps.length && !cancelled) {
        playing = false; finished = true;
        toggleEl.textContent = '完成';
        toggleEl.disabled = true;
        statusEl.textContent = '排序完成 ✓';
        clearHighlight();
        for (var i = 0; i < bars.length; i++) bars[i].classList.add('done');
      }
      return;
    }
    applyStep(steps[stepIdx]);
    stepIdx++;
    updateStats();
    var v = values();
    timer = setTimeout(tick, v.delay);
  }

  function start() {
    if (finished) return;
    if (playing) { // pause
      playing = false;
      cancelled = true;
      clearTimeout(timer);
      toggleEl.textContent = '继续';
      statusEl.textContent = '已暂停';
      return;
    }
    playing = true; cancelled = false;
    toggleEl.textContent = '暂停';
    statusEl.textContent = '播放中';
    tick();
  }

  function reset() {
    cancelled = true;
    clearTimeout(timer);
    rebuild();
  }

  var doneStyle = document.createElement('style');
  doneStyle.textContent = '#sortviz .bar.done { background: var(--viz-series-6); }';
  document.head.appendChild(doneStyle);

  var activeStyle = document.createElement('style');
  activeStyle.textContent = '#sortviz .bar.active { background: var(--primary); }';
  document.head.appendChild(activeStyle);

  toggleEl.addEventListener('click', start);
  regenEl.addEventListener('click', reset);
  algoEl.addEventListener('change', reset);
  modeEl.addEventListener('change', reset);
  nEl.addEventListener('input', function () {
    document.getElementById('sortviz-n-out').textContent = nEl.value;
    reset();
  });
  speedEl.addEventListener('input', function () {
    document.getElementById('sortviz-speed-out').textContent = speedEl.value + ' ms';
  });

  rebuild();
})();
</script>
