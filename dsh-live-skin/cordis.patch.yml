# ============================================================================
# LiveSkin —— DSH bundle patch
# ============================================================================
# 把 LiveSkin 的宿主行插进 Web profile 的配置树。客户端半边由 dsh-client-modules
# 依据 package.json 的 `dsh.client` + `exports["./client"]` 自动发现并投递，
# 这里不需要（也不能）为它单独写行。
#
# 安装：
#   dsh plugin --profile web add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: dsh-live-skin
      name: dsh-live-skin
